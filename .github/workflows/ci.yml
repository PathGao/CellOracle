name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 dropped: gimmemotifs 0.17.2 sdist build fails on 3.12
        # (versioneer.py uses configparser.SafeConfigParser, removed in 3.12;
        # CI run on commit 3ac5829). Fix belongs in gimmemotifs, not here.
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,bioconda
          activate-environment: test
      # gimmemotifs / louvain have no PyPI wheels that build on every matrix python;
      # upstream CI installs them from conda first (see .github/workflows/build_check.yml).
      - run: conda install -y gimmemotifs louvain
      - run: python -m pip install --upgrade pip
      - run: pip install .
      # run outside the checkout so the source tree cannot shadow the installed package
      - run: python -c "import celloracle, velocyto; print(celloracle.__version__, velocyto.__version__)"
        working-directory: ${{ runner.temp }}
      - run: pip install pytest
      - run: pytest "$GITHUB_WORKSPACE/tests"
        working-directory: ${{ runner.temp }}
